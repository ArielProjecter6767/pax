name: Build PAX for Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/groups-calls-windows, fix/windows-auth-calls-20261030, feature/preview-platform-qa]
    paths: ["windows/**", ".github/workflows/build-windows.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package.json
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: PAX-Windows
          path: windows/dist/*
          if-no-files-found: error