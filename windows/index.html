<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAX Messenger</title><link rel="stylesheet" href="styles.css"></head><body><section id="auth"><form id="authForm"><div class="mark">P</div><h1>PAX</h1><p>YOUR PEOPLE. YOUR SPACE.</p><div class="tabs"><button type="button" id="loginTab">Войти</button><button type="button" id="registerTab">Регистрация</button></div><input id="login" placeholder="Логин или email" required><div id="regFields" hidden><input id="username" placeholder="Username"><input id="display" placeholder="Отображаемое имя"><input id="email" type="email" placeholder="Email"></div><input id="password" type="password" placeholder="Пароль (8+ символов)" minlength="8" required><button class="primary">Продолжить</button><p id="error"></p></form></section><div id="app" hidden><aside><h2>PAX <button id="logout">Выйти</button></h2><button id="createGroup">＋ Создать группу</button><input id="search" placeholder="Поиск людей"><h4>ГРУППЫ</h4><div id="groups"></div><h4>ЛЮДИ</h4><div id="users"></div><small id="who"></small></aside><main><header><div><b id="chatTitle">Выберите чат</b><small id="chatSub"></small></div><button id="audio">☎ Аудио</button><button id="video">▣ Видео</button></header><div id="call" hidden><span id="callText"></span><button id="accept">Принять</button><button id="reject">Отклонить</button><button id="hangup">Завершить</button><button id="micToggle">Выключить микрофон</button><button id="camToggle">Выключить камеру</button><video id="remote" autoplay playsinline></video><video id="local" autoplay muted playsinline></video></div><div id="messages"></div><form id="sendForm"><textarea id="draft" placeholder="Написать сообщение..." disabled maxlength="4000"></textarea><button class="primary" disabled id="send">↑</button></form></main></div><dialog id="paxDialog"><form method="dialog"><h3 id="paxDialogTitle">PAX</h3><div id="paxDialogFields"></div><div class="dia
